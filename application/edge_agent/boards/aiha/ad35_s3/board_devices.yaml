version: 1.0.0
devices:
  # Boot-time I2C bus scan. Deliberately kept in the shipping profile: it is
  # cheap, runs once, and is the single most useful diagnostic for this board.
  # It is what identified the AW9523 at 0x59 and proved the vendor header's
  # SDA=6/SCL=5 pins were wrong. Without it, a mis-wired I2C bus presents as a
  # silently dead display rather than an obvious error. See README.md.
  - name: i2c_diagnostics
    chip: generic
    type: custom
    version: default
    peripherals:
      - name: i2c_master

  # AW9523 controls the LCD backlight cathodes (P8, P9, P11), reset (P14),
  # speaker amplifier PA_CTRL (P13 = P1_5), sensor power (P12 = P1_4),
  # and codec reset ES_CTRL (P10 = P1_2).
  - name: gpio_expander
    chip: aw9523b
    type: gpio_expander
    version: default
    dependencies:
      esp_io_expander_aw9523b:
        override_path: "${BOARD_PATH}/components/esp_io_expander_aw9523b"
        require: public
    config:
      max_pins: 16
      output_io_mask: [8, 9, 10, 11, 12, 13, 14]
      output_io_level_mask: [0, 0, 1, 0, 0, 0, 0]
      input_io_mask: null
    peripherals:
      - name: i2c_master
        # Board Manager expects the 8-bit wire address and probes i2c_addr >> 1.
        # AW9523's 7-bit address is 0x59, therefore this value must be 0xB2.
        i2c_addr: [0xB2]

  # Board Manager has no generated I80 display path. setup_device.c registers
  # this custom device while preserving the standard display_lcd contract.
  - name: display_lcd
    chip: st7796
    type: custom
    depends_on: gpio_expander
    version: default
    dependencies:
      espressif/esp_lcd_st7796: "^1.3.0"
    config:
      lcd_width: 480
      lcd_height: 320

  # Playback DAC — ES8311 @ 0x30.  PA_CTRL (HT6872 amplifier enable) is
  # on AW9523 P1_5, not an ESP32 GPIO.  The audio_codec framework's
  # gpio_pa_control peripheral cannot express an AW9523 pin, so the
  # amplifier is controlled manually in setup_device.c through the AW9523
  # expander handle.  This device declaration covers I2C codec init only.
  - name: audio_dac
    chip: es8311
    type: audio_codec
    version: default
    config:
      adc_enabled: false
      dac_enabled: true
      dac_max_channel: 1
      dac_channel_mask: "1"      # Left channel
      mclk_enabled: true
    peripherals:
      - name: i2s_audio_out
      - name: i2c_master
        address: 0x30
        frequency: 400000

  # Recording ADC — ES7210 @ 0x80.  Stereo microphone input (channels 1+2).
  - name: audio_adc
    chip: es7210
    type: audio_codec
    version: default
    config:
      adc_enabled: true
      dac_enabled: false
      adc_max_channel: 2
      adc_channel_mask: "0011"   # Mic0 + Mic1 enabled
      mclk_enabled: true
    peripherals:
      - name: i2s_audio_in
      - name: i2c_master
        address: 0x80
        frequency: 400000