version: 1.0.0
peripherals:
  - name: i2c_master
    type: i2c
    role: master
    config:
      port: 0
      pins:
        # AD35-S3: I2C is SDA=IO5 / SCL=IO4 per the board schematic
        # (AD35-S3.kicad_sch), confirmed on hardware — the AW9523 ACKs at 0x59.
        #
        # The vendor header PINS_AD35-S3.h says SDA=6/SCL=5. That is WRONG for
        # this board: 0.1.10 used it, scanned 0 devices, and failed to boot.
        # Because the vendor's DEV_DEVICE_INIT() macro never checks the return
        # value of aw.begin(), the failure was silent — backlight stayed off
        # and the LCD_RST pulse never happened, yet display init reported OK.
        #
        # No conflict with the I80 data bus: the schematic data lines are
        # DB0..DB7 = 9,3,8,18,17,16,15,7, none of which is 4 or 5.
        sda: 5
        scl: 4
