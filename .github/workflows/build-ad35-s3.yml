name: Build AD35-S3 firmware

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ESP-IDF v5.5 — AD35-S3
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.5

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install board-manager helper
        run: |
          source /opt/esp/idf/export.sh
          python -m pip install --disable-pip-version-check esp-bmgr-assist

      - name: Generate AD35-S3 board support
        working-directory: application/edge_agent
        run: |
          source /opt/esp/idf/export.sh
          idf.py bmgr -c ./boards/wireless-tag -b ad35_s3

      - name: Build firmware
        working-directory: application/edge_agent
        run: |
          source /opt/esp/idf/export.sh
          idf.py build

      - name: Package single-file firmware
        working-directory: application/edge_agent/build
        run: |
          source /opt/esp/idf/export.sh
          esptool.py --chip esp32s3 merge_bin -o merged.bin @flash_args
          printf '%s\n' \
            '# AD35-S3 flashing instructions' \
            '' \
            'This artifact contains `merged.bin`: a complete 16 MB flash image.' \
            'Write it at offset `0x0`; do not select an app-only offset such as `0x20000`.' \
            '' \
            '## esptool (recommended)' \
            '' \
            '```bash' \
            'python -m esptool --chip esp32s3 --port <PORT> --baud 460800 write_flash 0x0 merged.bin' \
            '```' \
            '' \
            'Replace `<PORT>` with the board serial port, for example `/dev/ttyACM0` on Linux or `COM3` on Windows.' \
            'Hold BOOT while resetting if the board does not enter download mode.' \
            '' \
            '## Browser flasher' \
            '' \
            'Choose `merged.bin` and set its address/offset to `0x0`.' \
            '' \
            'After first boot, connect to the `esp-claw-XXXXXX` Wi-Fi network and open `http://192.168.4.1/` to configure Wi-Fi and the Edge Agent.' \
            > FLASH.md

      - name: Upload flashable firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp-claw-ad35-s3-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            application/edge_agent/build/merged.bin
            application/edge_agent/build/FLASH.md
            application/edge_agent/build/*.bin
            application/edge_agent/build/bootloader/*.bin
            application/edge_agent/build/partition_table/*.bin
            application/edge_agent/build/flasher_args.json
            application/edge_agent/build/flash_args
            application/edge_agent/build/flash_project_args
            application/edge_agent/build/sdkconfig
